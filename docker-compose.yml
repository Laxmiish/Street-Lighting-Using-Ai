services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: street_lighting_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      POSTGRES_DB: ${DB_NAME:-street_lighting_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-street_lighting_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lumina-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: street_lighting_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres123}@timescaledb:5432/${DB_NAME:-street_lighting_db}
      - CORS_ORIGIN=*
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - lumina-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: street_lighting_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      - backend
    networks:
      - lumina-network

volumes:
  pgdata:
    driver: local

networks:
  lumina-network:
    driver: bridge
