<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Light Beam Gradient: Transitions from Yellow Light to AI Blue -->
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Pole Metallic Gradient -->
    <linearGradient id="poleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Tech Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Theme Background -->
  <rect width="512" height="512" rx="48" fill="#0F172A"/>

  <!-- Emitted Light Beam -->
  <polygon points="190,140 322,140 450,450 62,450" fill="url(#lightBeam)" />

  <!-- Neural Network / AI Connections -->
  <g stroke="#38BDF8" stroke-width="4" opacity="0.85">
    <line x1="256" y1="220" x2="170" y2="320" />
    <line x1="256" y1="220" x2="342" y2="320" />
    <line x1="170" y1="320" x2="256" y2="420" />
    <line x1="342" y1="320" x2="256" y2="420" />
    <line x1="256" y1="220" x2="256" y2="420" />
    <line x1="170" y1="320" x2="342" y2="320" />
  </g>

  <!-- Glowing AI Data Nodes -->
  <g fill="#0F172A" stroke="#38BDF8" stroke-width="4" filter="url(#glow)">
    <circle cx="256" cy="220" r="10" />
    <circle cx="170" cy="320" r="12" />
    <circle cx="342" cy="320" r="12" />
    <circle cx="256" cy="420" r="10" />
    <circle cx="256" cy="320" r="14" fill="#38BDF8" />
  </g>

  <!-- Modern Street Light Pole -->
  <path d="M 400,512 L 430,512 L 430,160 Q 430,90 320,90 L 160,90 L 160,110 L 320,110 Q 400,110 400,160 Z" fill="url(#poleGradient)"/>

  <!-- Aerodynamic Lamp Housing -->
  <rect x="130" y="80" width="180" height="32" rx="16" fill="#E2E8F0"/>

  <!-- High-Efficiency LED Bulb -->
  <path d="M 160,112 L 280,112 L 270,140 L 170,140 Z" fill="#FDE047" filter="url(#glow)"/>
</svg>
