<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Light Beam Gradient: Transitions from Yellow Light to AI Blue -->
    <linearGradient id="beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1"/>
    </linearGradient>
    
    <!-- Heavy Glow for small-scale visibility -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Background (Rounded Square) -->
  <rect width="512" height="512" rx="112" fill="#0F172A"/>

  <!-- Emitted Light Beam -->
  <polygon points="180,180 332,180 440,480 72,480" fill="url(#beam)" />

  <!-- AI Neural Network Lines -->
  <g stroke="#38BDF8" stroke-width="16" stroke-linecap="round">
    <line x1="256" y1="180" x2="256" y2="290" />
    <line x1="256" y1="290" x2="160" y2="360" />
    <line x1="256" y1="290" x2="352" y2="360" />
  </g>
  
  <!-- Glowing AI Nodes -->
  <circle cx="256" cy="290" r="32" fill="#0F172A" stroke="#38BDF8" stroke-width="14" filter="url(#glow)"/>
  <circle cx="256" cy="290" r="16" fill="#FDE047" />

  <circle cx="160" cy="360" r="24" fill="#0F172A" stroke="#38BDF8" stroke-width="12" />
  <circle cx="352" cy="360" r="24" fill="#0F172A" stroke="#38BDF8" stroke-width="12" />

  <!-- Modern Street Light Head (Thickened for scale) -->
  <rect x="110" y="90" width="292" height="90" rx="45" fill="#E2E8F0" />
  
  <!-- LED Bulb Strip -->
  <rect x="160" y="160" width="192" height="24" rx="12" fill="#FEF08A" filter="url(#glow)"/>
</svg>
